<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Tracker & CAMM Video Recorder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

    <!-- JSZip v3.10.1 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- toGeoJSON v5.5.0 -->
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.5.0/dist/togeojson.umd.js"></script>

    <!-- MP4Box.js v0.5.2 (CAMM GPS Metadata Track Embedding) -->
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        #workspace-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .main-map-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Floating Camera Window (PiP Default) */
        .camera-window-container {
            position: fixed;
            top: 92px;
            left: 12px;
            width: 180px;
            height: 240px;
            z-index: 25;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            border: 1.5px solid rgba(56, 189, 248, 0.45);
            background: #020617;
            transition: width 0.25s ease, height 0.25s ease;
        }

        @media (min-width: 640px) {
            .camera-window-container {
                width: 240px;
                height: 180px;
            }
        }

        /* Fullscreen Camera Mode */
        .camera-window-container.camera-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 15 !important;
        }

        /* 50/50 Split View Mode */
        .view-mode-split {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        @media (min-width: 768px) {
            .view-mode-split {
                flex-direction: row;
            }
        }
        .view-mode-split .main-map-container {
            position: relative !important;
            width: 100% !important;
            height: 50vh !important;
            z-index: 1 !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.18);
        }
        .view-mode-split .camera-window-container {
            position: relative !important;
            width: 100% !important;
            height: 50vh !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
            border-radius: 0 !important;
        }
        @media (min-width: 768px) {
            .view-mode-split .main-map-container,
            .view-mode-split .camera-window-container {
                width: 50vw !important;
                height: 100vh !important;
                border-bottom: none;
            }
            .view-mode-split .main-map-container {
                border-right: 2px solid rgba(255, 255, 255, 0.18);
            }
        }

        /* Recording Pulse Ring Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.9; }
            70% { transform: scale(2.4); opacity: 0; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .pulse-ring {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 9999px;
            background-color: rgba(244, 63, 94, 0.65);
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Hide default Leaflet attribution clutter on tiny screens */
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.65) !important;
            color: #94a3b8 !important;
            font-size: 9px !important;
        }
        .leaflet-control-attribution a {
            color: #38bdf8 !important;
        }
    </style>
</head>
<body>

    <div id="workspace-root">
        <!-- FULLSCREEN LEAFLET MAP -->
        <div id="map" class="main-map-container"></div>

        <!-- CAMERA VIEWFINDER WINDOW (Draggable PiP / Split / Fullscreen) -->
        <div id="camera-window" class="camera-window-container flex flex-col">
            <!-- Drag Handle & Layout Switcher Header -->
            <div id="cam-drag-header" class="flex items-center justify-between px-2.5 py-1.5 bg-slate-950/90 border-b border-slate-800 cursor-move select-none z-10">
                <span class="text-[10px] font-extrabold text-cyan-400 flex items-center gap-1">
                    <i class="fa-solid fa-video"></i> CAM
                </span>
                <div class="flex items-center gap-1">
                    <button id="btn-switch-camera" type="button" title="カメラ切替" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-camera-rotate"></i>
                    </button>
                    <button id="btn-layout-map" type="button" title="地図メイン(PiP)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] flex items-center justify-center">
                        🗺️
                    </button>
                    <button id="btn-layout-split" type="button" title="上下/左右分割" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] flex items-center justify-center">
                        🌗
                    </button>
                    <button id="btn-layout-cam" type="button" title="カメラ全画面" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] flex items-center justify-center">
                        📷
                    </button>
                </div>
            </div>

            <!-- Video Stream Element -->
            <div class="relative flex-1 w-full h-full bg-black overflow-hidden">
                <video id="camera-preview" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <video id="camm-playback-video" playsinline class="w-full h-full object-contain bg-black hidden"></video>

                <!-- Live REC Badge + Timer -->
                <div id="cam-rec-badge" class="absolute top-2 left-2 px-2 py-0.5 bg-rose-600/95 text-[10px] font-bold rounded-full text-white hidden flex items-center gap-1.5 shadow-lg">
                    <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
                    <span>REC</span>
                    <span id="cam-rec-timer" class="font-mono">00:00</span>
                </div>

                <!-- Playback Mode Badge -->
                <div id="cam-playback-badge" class="absolute top-2 left-2 px-2 py-0.5 bg-cyan-600/95 text-[10px] font-bold rounded-full text-white hidden flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-film"></i>
                    <span>CAMM再生中</span>
                </div>

                <!-- Live Video Buffer Size Badge -->
                <div id="cam-size-badge" class="absolute top-2 right-2 px-2 py-0.5 bg-slate-900/85 border border-cyan-500/40 text-[10px] font-mono rounded-full text-cyan-300 hidden">
                    0.0 MB
                </div>

                <!-- GPS Fix Indicator inside Camera -->
                <div id="cam-gps-badge" class="absolute bottom-2 left-2 px-2 py-0.5 bg-slate-900/80 border border-slate-700/80 text-[10px] font-mono rounded-md text-emerald-400">
                    GPS: 測位中...
                </div>
            </div>
        </div>
    </div>

    <!-- TOP CENTER: Live Telemetry HUD -->
    <div class="fixed top-3 left-1/2 -translate-x-1/2 z-30 w-[94%] max-w-md glass-panel rounded-2xl px-3 py-2.5">
        <div class="grid grid-cols-4 gap-1 text-center">
            <div>
                <div class="text-[10px] text-slate-400 font-semibold">経過時間</div>
                <div id="hud-elapsed" class="text-sm sm:text-base font-bold font-mono text-white">00:00</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-semibold">走行距離</div>
                <div id="hud-distance" class="text-sm sm:text-base font-bold font-mono text-cyan-400">0.00 <span class="text-[10px] font-normal">km</span></div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-semibold">現在速度</div>
                <div id="hud-speed" class="text-sm sm:text-base font-bold font-mono text-emerald-400">0.0 <span class="text-[10px] font-normal">km/h</span></div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-semibold">動画容量</div>
                <div id="hud-video-size" class="text-sm sm:text-base font-bold font-mono text-amber-400">0.0 <span class="text-[10px] font-normal">MB</span></div>
            </div>
        </div>
    </div>

    <!-- TOP RIGHT: Vertical Action Buttons (44x44px touch targets at top: 92px) -->
    <div class="fixed right-3 top-[92px] z-30 flex flex-col gap-2.5">
        <button id="btn-zoom-in" type="button" aria-label="拡大" class="w-11 h-11 glass-panel hover:bg-slate-800 active:scale-95 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-lg transition">
            ＋
        </button>
        <button id="btn-zoom-out" type="button" aria-label="縮小" class="w-11 h-11 glass-panel hover:bg-slate-800 active:scale-95 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-lg transition">
            －
        </button>
        <button id="btn-map-layers" type="button" aria-label="地図切替" class="w-11 h-11 glass-panel hover:bg-slate-800 active:scale-95 rounded-xl flex items-center justify-center text-lg shadow-lg transition">
            🗺️
        </button>
        <button id="btn-track-style" type="button" aria-label="スタイル設定" class="w-11 h-11 glass-panel hover:bg-slate-800 active:scale-95 rounded-xl flex items-center justify-center text-lg shadow-lg transition">
            🎨
        </button>
        <button id="btn-toggle-cam-overlay" type="button" aria-label="カメラ表示切替" title="カメラウィンドウ表示/非表示" class="w-11 h-11 glass-panel hover:bg-slate-800 active:scale-95 rounded-xl flex items-center justify-center text-cyan-300 text-base shadow-lg transition">
            <i id="icon-toggle-cam-overlay" class="fa-solid fa-video"></i>
        </button>
        <button id="btn-open-camm-file" type="button" aria-label="CAMM動画読込" title="CAMM動画/ZIP読み込み" class="w-11 h-11 glass-panel hover:bg-slate-800 active:scale-95 rounded-xl flex items-center justify-center text-lg shadow-lg transition border border-cyan-500/40">
            📂
        </button>
        <!-- iOS Safari compatible unrestricted file input (extension checked in JS) -->
        <input type="file" id="input-camm-file" class="hidden" />
    </div>

    <!-- BOTTOM RECORDING & EXPORT CONTROL PANEL -->
    <div id="bottom-control-panel" class="fixed bottom-0 left-0 right-0 z-30 glass-panel rounded-t-3xl border-t border-slate-700/80 transition-all duration-300">
        <!-- Collapse / Expand Toggle Bar -->
        <button id="btn-collapse-bottom" type="button" class="w-full py-2 px-4 flex items-center justify-center gap-2 text-xs font-bold text-slate-300 hover:text-white border-b border-slate-800/80">
            <span id="collapse-icon">▼</span>
            <span id="collapse-label">メニューを折りたたむ</span>
        </button>

        <!-- Collapsible Body -->
        <div id="bottom-panel-body" class="p-2.5 sm:p-3.5 max-w-xl mx-auto space-y-2">
            <!-- SLIM CAMM VIDEO PLAYBACK SCRUBBER PANEL (Shown when a CAMM video/ZIP is loaded) -->
            <div id="camm-player-panel" class="hidden bg-slate-900/95 border border-cyan-500/50 rounded-xl px-2.5 py-2 space-y-1.5 shadow-inner">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <span class="text-[11px]">🎬</span>
                        <span id="camm-loaded-title" class="text-[11px] font-extrabold text-cyan-300 truncate">CAMM動画プレイヤー</span>
                        <span id="camm-telemetry-badge" class="text-[9px] font-mono bg-slate-800 text-emerald-300 px-1.5 py-0.5 rounded shrink-0">
                            0 pt
                        </span>
                    </div>
                    <button id="btn-close-camm-player" type="button" title="プレイヤーを閉じる" class="px-2 py-0.5 bg-slate-800 hover:bg-rose-900/60 text-slate-300 hover:text-white rounded text-[10px] font-bold transition shrink-0">
                        ✕
                    </button>
                </div>

                <!-- Single-row Compact Playback Controls & Scrubber -->
                <div class="flex items-center gap-2">
                    <button id="btn-camm-play-pause" type="button" class="w-8 h-8 shrink-0 rounded-lg bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white text-xs flex items-center justify-center shadow transition">
                        <i id="icon-camm-play-pause" class="fa-solid fa-play"></i>
                    </button>

                    <span id="camm-time-current" class="text-[10px] font-mono text-slate-300 shrink-0">00:00.0</span>

                    <input type="range" id="slider-camm-seek" min="0" max="100" step="0.05" value="0" class="flex-1 accent-cyan-400 cursor-pointer h-1.5 bg-slate-700 rounded-lg min-w-0" />

                    <span id="camm-time-total" class="text-[10px] font-mono text-slate-400 shrink-0">00:00.0</span>
                </div>
                <div class="flex justify-end">
                    <span id="camm-coord-readout" class="text-[9px] font-mono text-cyan-300/90 truncate">---, ---</span>
                </div>
            </div>

            <!-- Compact Bottom Action Row (Never blocks map view) -->
            <div class="flex items-center gap-1.5">
                <button id="btn-track-mode" type="button" class="py-3 px-2 bg-slate-800/95 hover:bg-slate-700 border border-slate-600/80 rounded-xl text-[11px] font-bold text-cyan-400 active:scale-95 transition text-center truncate shrink-0">
                    追尾: 現在地
                </button>

                <button id="btn-load-camm-inline" type="button" class="py-3 px-2.5 bg-slate-800/95 hover:bg-slate-700 border border-cyan-500/50 rounded-xl text-[11px] font-bold text-cyan-300 active:scale-95 transition flex items-center justify-center gap-1 shrink-0">
                    <span>📂 読込</span>
                </button>

                <button id="btn-open-export-modal" type="button" class="hidden py-3 px-2.5 bg-cyan-950/90 hover:bg-cyan-900 border border-cyan-400/70 rounded-xl text-[11px] font-extrabold text-cyan-300 active:scale-95 transition flex items-center justify-center gap-1 shrink-0 shadow">
                    <span>💾 出力</span>
                </button>

                <button id="btn-record-toggle" type="button" class="flex-1 py-3 px-2.5 bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white rounded-xl font-extrabold text-xs shadow-lg shadow-rose-950/60 transition flex items-center justify-center gap-1.5 min-w-0">
                    <span id="record-btn-dot" class="w-2.5 h-2.5 rounded-full bg-white inline-block shrink-0"></span>
                    <span id="record-btn-label" class="truncate">記録開始</span>
                </button>
            </div>

            <!-- Footer Status & Version -->
            <div class="flex items-center justify-between text-[10px] text-slate-400 pt-0.5">
                <span id="wake-lock-indicator">WakeLock: 待機中 / GPS: 0 pt</span>
                <span class="font-mono text-slate-400">v2026.11.17.1703</span>
            </div>
        </div>
    </div>

    <!-- MODAL: Export & Save Options (Keeps map unobstructed) -->
    <div id="modal-export-options" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">💾 記録データの保存・出力</h3>
                <button id="close-export-modal" type="button" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center justify-between text-xs bg-slate-900/90 px-3 py-2 rounded-xl border border-slate-700/80">
                <span class="font-bold text-cyan-300">記録サマリー</span>
                <span id="export-summary-badge" class="font-mono text-slate-200">0 pt / 0.0 MB</span>
            </div>

            <div class="space-y-2.5">
                <!-- Primary: CAMM MP4 Export Button -->
                <button id="btn-export-camm-mp4" type="button" class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-[0.99] text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-lg shadow-cyan-950/60 transition flex items-center justify-center gap-2">
                    <span>📹 CAMM MP4動画を保存</span>
                    <span id="camm-btn-size" class="text-[11px] font-mono font-normal bg-black/25 px-2 py-0.5 rounded-full">0.0 MB</span>
                </button>

                <!-- Secondary & Tertiary Export Buttons -->
                <button id="btn-export-zip" type="button" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 active:scale-95 text-amber-300 font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
                    <span>📦 ZIP一括保存 (MP4 + GPX + CAMM)</span>
                </button>

                <button id="btn-export-gpx" type="button" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 active:scale-95 text-slate-200 font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
                    <span>📄 GPX軌跡のみ保存</span>
                </button>
            </div>

            <!-- Mobile Share Sheet Option -->
            <div class="pt-2 border-t border-slate-800 text-[11px] text-slate-300">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="chk-use-share-sheet" class="rounded accent-cyan-500 w-4 h-4 shrink-0">
                    <span>スマホ共有メニュー（「ファイルに保存」でフォルダ指定）を使う</span>
                </label>
            </div>
        </div>
    </div>

    <!-- MODAL: Basemap Switcher -->
    <div id="modal-map-layers" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">🗺️ 背景地図の切り替え</h3>
                <button id="close-map-modal" type="button" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="grid grid-cols-1 gap-2 max-h-[60vh] overflow-y-auto pr-1" id="basemap-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- MODAL: Track Style Customizer -->
    <div id="modal-track-style" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">🎨 軌跡ライン設定</h3>
                <button id="close-style-modal" type="button" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-4 text-xs">
                <div class="flex items-center justify-between bg-slate-900/80 p-3 rounded-xl border border-slate-700/70">
                    <span class="font-bold text-slate-200">軌跡カラー</span>
                    <input type="color" id="input-track-color" value="#ff2d55" class="w-10 h-8 rounded cursor-pointer bg-transparent border-0">
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/70 space-y-2">
                    <div class="flex justify-between">
                        <span class="font-bold text-slate-200">線の太さ</span>
                        <span id="label-track-weight" class="font-mono text-cyan-400">10 px</span>
                    </div>
                    <input type="range" id="input-track-weight" min="1" max="20" value="10" class="w-full accent-cyan-500">
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/70 space-y-2">
                    <div class="flex justify-between">
                        <span class="font-bold text-slate-200">不透明度</span>
                        <span id="label-track-opacity" class="font-mono text-cyan-400">90 %</span>
                    </div>
                    <input type="range" id="input-track-opacity" min="10" max="100" value="90" class="w-full accent-cyan-500">
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION BANNER -->
    <div id="toast-banner" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md glass-panel border border-cyan-500/40 rounded-2xl p-3.5 shadow-2xl hidden transition-all duration-300">
        <div class="flex items-start gap-3">
            <div id="toast-icon" class="text-lg mt-0.5">✅</div>
            <div class="flex-1 min-w-0">
                <div id="toast-title" class="text-xs font-extrabold text-white truncate">保存完了</div>
                <div id="toast-desc" class="text-[11px] text-slate-300 mt-0.5 leading-relaxed"></div>
            </div>
            <button id="toast-close" type="button" class="text-slate-400 hover:text-white px-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <script>
        const APP_VERSION = 'v2026.11.17.1703';

        // Map & Geolocation State
        let map = null;

        // Initialization
        function bootstrapApp() {
            ensureLeafletLoaded(() => {
                initMap();
                bindUIEvents();
                bindStyleEvents();
                initPiPDragging();

                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                const shareCheckbox = document.getElementById('chk-use-share-sheet');
                if (isIOS && typeof navigator.share === 'function' && shareCheckbox) {
                    shareCheckbox.checked = true;
                }

                startCamera();
                startGeolocationWatch();
            });
        }

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', bootstrapApp);
        } else {
            bootstrapApp();

        function ensureLeafletLoaded(callback) {
            if (typeof L !== 'undefined') {
                callback();
                return;
            }
            const fallbackScript = document.createElement('script');
            fallbackScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
            fallbackScript.onload = () => callback();
            document.head.appendChild(fallbackScript);
        }

        // 1. Leaflet Map Initialization
        function initMap() {
            if (typeof L === 'undefined') return;
            const mapEl = document.getElementById('map');
            if (!mapEl) {
                console.error('Map container #map not found in DOM.');
                return;
            }

            map = L.map(mapEl, {
                center: [37.398, 140.388],
                zoom: 13,
                zoomControl: false,
                attributionControl: true
            });

            setBasemap('gsi_pale');
            renderBasemapModalList();

            userPolyline = L.polyline([], {
                color: trackStyle.color,
                weight: trackStyle.weight,
                opacity: trackStyle.opacity,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            cammPlaybackPolyline = L.polyline([], {
                color: '#00d2ff',
                weight: 8,
                opacity: 0.85,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);
        }

        function setBasemap(basemapId) {
            const bm = BASEMAPS.find(b => b.id === basemapId) || BASEMAPS[0];
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            currentTileLayer = L.tileLayer(bm.url, {
                attribution: bm.attr,
                maxZoom: 19
            }).addTo(map);
        }

        function renderBasemapModalList() {
            const container = document.getElementById('basemap-list');
            if (!container) return;
            container.innerHTML = '';
            BASEMAPS.forEach(bm => {
                const btn = document.createElement('button');
                btn.type = 'button';

                btn.innerHTML = `<span>${bm.name}</span><i class="fa-solid fa-chevron-right text-slate-500"></i>`;
                btn.addEventListener('click', () => {
                    setBasemap(bm.id);
                    document.getElementById('modal-map-layers').classList.add('hidden');
                });
                container.appendChild(btn);
            });
        }

        // 2. Camera & Multi-Layout Management
        async function startCamera() {
            const videoEl = document.getElementById('camera-preview');
            if (!videoEl) return;

            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: cameraFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: true
                });
                videoEl.srcObject = cameraStream;
            } catch (err) {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: cameraFacingMode },
                        audio: false
                    });
                    videoEl.srcObject = cameraStream;
                } catch (err2) {
                    console.warn('Camera unavailable:', err2);
                    const gpsBadge = document.getElementById('cam-gps-badge');
                    if (gpsBadge) {
                        gpsBadge.textContent = 'カメラ未接続 (GPSのみ記録可)';
                    }
                }
            }
        }

        async function switchCameraFacing() {
            if (isRecording) {
                showToast('録画中はカメラ切替不可', '録画を停止してからカメラを切り替えてください。', 'warning');
                return;
            }
            cameraFacingMode = cameraFacingMode === 'environment' ? 'user' : 'environment';
            await startCamera();
        }

        function setLayoutMode(mode) {
            currentLayoutMode = mode;
            const root = document.getElementById('workspace-root');
            const camBox = document.getElementById('camera-window');
            if (!root || !camBox) return;

            root.classList.remove('view-mode-split');
            camBox.classList.remove('camera-fullscreen');
            camBox.style.left = '';
            camBox.style.top = '';

            if (mode === 'split') {
                root.classList.add('view-mode-split');
                camBox.classList.remove('hidden');
                isCameraVisible = true;
            } else if (mode === 'camera') {
                camBox.classList.add('camera-fullscreen');
                camBox.classList.remove('hidden');
                isCameraVisible = true;
            } else {
                if (isCameraVisible) {
                    camBox.classList.remove('hidden');
                }
            }

            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 150);
        }

        function initPiPDragging() {
            const camBox = document.getElementById('camera-window');
            const header = document.getElementById('cam-drag-header');
            if (!camBox || !header) return;

            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let origLeft = 0;
            let origTop = 0;

            const onStart = (clientX, clientY) => {
                if (currentLayoutMode !== 'map') return;
                isDragging = true;
                const rect = camBox.getBoundingClientRect();
                startX = clientX;
                startY = clientY;
                origLeft = rect.left;
                origTop = rect.top;
            };

            const onMove = (clientX, clientY) => {
                if (!isDragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                const newLeft = Math.max(8, Math.min(window.innerWidth - camBox.offsetWidth - 8, origLeft + dx));
                const newTop = Math.max(8, Math.min(window.innerHeight - camBox.offsetHeight - 8, origTop + dy));
                camBox.style.left = `${newLeft}px`;
                camBox.style.top = `${newTop}px`;
            };

            const onEnd = () => {
                isDragging = false;
            };

            header.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onEnd);

            header.addEventListener('touchstart', e => {
                if (e.touches.length > 0) {
                    onStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', e => {
                if (isDragging && e.touches.length > 0) {
                    onMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchend', onEnd);
        }

        // 3. Geolocation & Marker Updates
        function updateUserMarker(lat, lng) {
            if (!map) return;
            const html = isRecording
                ? `<div class="relative flex items-center justify-center w-6 h-6">
                       <span class="pulse-ring"></span>
                       <span class="w-4 h-4 rounded-full bg-rose-500 border-2 border-white shadow-lg"></span>
                   </div>`
                : `<div class="flex items-center justify-center w-5 h-5">
                       <span class="w-4 h-4 rounded-full bg-sky-500 border-2 border-white shadow-lg"></span>
                   </div>`;

            const icon = L.divIcon({
                html: html,
                className: '',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            if (!userMarker) {
                userMarker = L.marker([lat, lng], { icon: icon }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
                userMarker.setIcon(icon);
            }
        }

        function panWithBottomOffset(latlng) {
            if (!map) return;
            const panel = document.getElementById('bottom-control-panel');
            const offsetPx = (panel && !isBottomCollapsed) ? Math.round(panel.offsetHeight * 0.35) : 0;
            const targetPoint = map.project(latlng, map.getZoom());
            targetPoint.y += offsetPx;
            const adjustedLatLng = map.unproject(targetPoint, map.getZoom());
            map.panTo(adjustedLatLng, { animate: true, duration: 0.4 });
        }

        function applyTrackingCamera() {
            if (!map) return;

            if (trackingMode === 0) {
                // 追尾: 現在地
                if (currentPosition) {
                    panWithBottomOffset([currentPosition.lat, currentPosition.lng]);
                }
            } else if (trackingMode === 1) {
                // 追尾: 読込データ (CAMM/ZIP GPS marker)
                if (isCammPlaybackActive && cammPlaybackMarker) {
                    panWithBottomOffset(cammPlaybackMarker.getLatLng());
                }
            } else if (trackingMode === 2) {
                // 追尾: 全体表示
                if (isCammPlaybackActive && cammPlaybackPoints.length > 1) {
                    const bounds = cammPlaybackPolyline.getBounds();
                    if (bounds.isValid()) {
                        const panel = document.getElementById('bottom-control-panel');
                        const bottomPad = (panel && !isBottomCollapsed) ? panel.offsetHeight + 24 : 40;
                        map.fitBounds(bounds, { paddingTopLeft: [30, 90], paddingBottomRight: [30, bottomPad] });
                    }
                } else if (recordedPoints.length > 1) {
                    const bounds = userPolyline.getBounds();
                    if (bounds.isValid()) {
                        const panel = document.getElementById('bottom-control-panel');
                        const bottomPad = (panel && !isBottomCollapsed) ? panel.offsetHeight + 24 : 40;
                        map.fitBounds(bounds, { paddingTopLeft: [30, 90], paddingBottomRight: [30, bottomPad] });
                    }
                }
            }
        }

        function startGeolocationWatch() {
            if (!('geolocation' in navigator)) {
                document.getElementById('cam-gps-badge').textContent = 'GPS非対応ブラウザ';
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const ele = pos.coords.altitude || 0;
                    const speedMps = pos.coords.speed || 0;
                    const heading = pos.coords.heading || 0;
                    const acc = Math.round(pos.coords.accuracy || 0);

                    currentPosition = { lat, lng, ele, speedMps, heading };
                    updateUserMarker(lat, lng);

                    const speedKmh = (speedMps * 3.6).toFixed(1);
                    document.getElementById('hud-speed').innerHTML = `${speedKmh} <span class="text-[10px] font-normal">km/h</span>`;
                    document.getElementById('cam-gps-badge').textContent = `GPS: ±${acc}m / ${speedKmh}km/h`;

                    if (isRecording) {
                        const nowMs = Date.now();
                        if (recordedPoints.length > 0) {
                            const prev = recordedPoints[recordedPoints.length - 1];
                            const dist = haversineDistance(prev.lat, prev.lng, lat, lng);
                            totalDistanceMeters += dist;
                        }

                        const pt = {
                            lat: lat,
                            lng: lng,
                            ele: ele,
                            speed: speedMps,
                            heading: heading,
                            isoTime: new Date(nowMs).toISOString(),
                            timestampOffsetMs: nowMs - recordStartMs
                        };
                        recordedPoints.push(pt);
                        if (userPolyline) {
                            userPolyline.addLatLng([lat, lng]);
                        }

                        document.getElementById('hud-distance').innerHTML = `${(totalDistanceMeters / 1000).toFixed(2)} <span class="text-[10px] font-normal">km</span>`;
                        updateFooterTelemetryText();
                    }

                    applyTrackingCamera();
                },
                (err) => {
                    document.getElementById('cam-gps-badge').textContent = `GPSエラー: ${err.message}`;
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 10000
                }
            );
        }

        // 4. MediaRecorder Video Capture
        function startMediaRecording() {
            recordedVideoBlob = null;
            cachedCammResult = null;
            recordedChunks = [];
            recordedBytesTotal = 0;

            if (!cameraStream) {
                showToast('カメラ未接続', 'カメラが起動していないためGPS軌跡のみ記録します。', 'warning');
                return;
            }

            const preferredTypes = [
                'video/mp4;codecs=avc1',
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];

            let selectedMime = '';
            for (const t of preferredTypes) {
                if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) {
                    selectedMime = t;
                    break;
                }
            }

            try {
                mediaRecorder = selectedMime
                    ? new MediaRecorder(cameraStream, { mimeType: selectedMime, videoBitsPerSecond: 2500000 })
                    : new MediaRecorder(cameraStream, { videoBitsPerSecond: 2500000 });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(cameraStream);
                } catch (err2) {
                    console.warn('MediaRecorder initialization failed:', err2);
                    return;
                }
            }

            mediaRecorder.ondataavailable = (ev) => {
                if (ev.data && ev.data.size > 0) {
                    recordedChunks.push(ev.data);
                    recordedBytesTotal += ev.data.size;
                    const mbStr = (recordedBytesTotal / (1024 * 1024)).toFixed(1);
                    document.getElementById('hud-video-size').innerHTML = `${mbStr} <span class="text-[10px] font-normal">MB</span>`;
                    document.getElementById('cam-size-badge').textContent = `${mbStr} MB`;
                }
            };

            mediaRecorder.start(250);
            document.getElementById('cam-rec-badge').classList.remove('hidden');
            document.getElementById('cam-size-badge').classList.remove('hidden');
        }

        function stopMediaRecordingAndFlush() {
            return new Promise((resolve) => {
                document.getElementById('cam-rec-badge').classList.add('hidden');
                document.getElementById('cam-size-badge').classList.add('hidden');

                if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                    if (recordedChunks.length > 0) {
                        const mime = (mediaRecorder && mediaRecorder.mimeType) || 'video/mp4';
                        recordedVideoBlob = new Blob(recordedChunks, { type: mime });
                    }
                    resolve(recordedVideoBlob);
                    return;
                }

                let isResolved = false;
                const finalizeBlob = () => {
                    if (isResolved) return;
                    isResolved = true;
                    clearTimeout(fallbackTimer);

                    const mime = (mediaRecorder && mediaRecorder.mimeType) || 'video/mp4';
                    if (recordedChunks.length > 0) {
                        recordedVideoBlob = new Blob(recordedChunks, { type: mime });
                        const mbStr = (recordedVideoBlob.size / (1024 * 1024)).toFixed(2);
                        document.getElementById('hud-video-size').innerHTML = `${mbStr} <span class="text-[10px] font-normal">MB</span>`;
                    }
                    resolve(recordedVideoBlob);
                };

                // Safety timeout: prevents infinite hang if browser fails to fire onstop
                const fallbackTimer = setTimeout(() => {
                    console.warn('MediaRecorder.onstop timed out; finalizing with collected chunks.');
                    finalizeBlob();
                }, 1500);

                mediaRecorder.onstop = finalizeBlob;
                mediaRecorder.onerror = (err) => {
                    console.warn('MediaRecorder error during stop:', err);
                    finalizeBlob();
                };

                try {
                    if (typeof mediaRecorder.requestData === 'function' && mediaRecorder.state === 'recording') {
                        mediaRecorder.requestData();
                    }
                } catch (e) {
                    console.warn('requestData skipped:', e);
                }

                try {
                    mediaRecorder.stop();
                } catch (stopErr) {
                    console.warn('mediaRecorder.stop() threw:', stopErr);
                    finalizeBlob();
                }
            });
        }

        // 5. Synchronized Start / Stop Recording
        async function toggleRecording() {
            if (!isRecording) {
                await beginSessionRecording();
            } else {
                await endSessionRecording();
            }
        }

        async function beginSessionRecording() {
            isRecording = true;
            recordStartMs = Date.now();
            recordedPoints = [];
            totalDistanceMeters = 0;
            if (userPolyline) {
                userPolyline.setLatLngs([]);
            }

            document.getElementById('btn-open-export-modal').classList.add('hidden');
            document.getElementById('modal-export-options').classList.add('hidden');
            document.getElementById('hud-elapsed').textContent = '00:00';
            document.getElementById('hud-distance').innerHTML = `0.00 <span class="text-[10px] font-normal">km</span>`;
            document.getElementById('hud-video-size').innerHTML = `0.0 <span class="text-[10px] font-normal">MB</span>`;
            updateFooterTelemetryText();

            const recBtn = document.getElementById('btn-record-toggle');
            recBtn.className = 'flex-1 py-3 px-3 bg-slate-700 hover:bg-slate-600 active:scale-[0.98] text-white rounded-xl font-extrabold text-xs shadow-lg transition flex items-center justify-center gap-1.5 border border-rose-500/60 min-w-0';
            document.getElementById('record-btn-dot').className = 'w-2.5 h-2.5 rounded-sm bg-rose-500 inline-block animate-pulse shrink-0';
            document.getElementById('record-btn-label').textContent = '記録停止';

            if (currentPosition) {
                updateUserMarker(currentPosition.lat, currentPosition.lng);
            }

            elapsedTimerInterval = setInterval(() => {
                const sec = Math.floor((Date.now() - recordStartMs) / 1000);
                const formatted = formatMMSS(sec);
                document.getElementById('hud-elapsed').textContent = formatted;
                document.getElementById('cam-rec-timer').textContent = formatted;
            }, 500);

            await requestScreenWakeLock();
            startMediaRecording();
        }

        async function endSessionRecording() {
            isRecording = false;
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }

            if (currentPosition) {
                updateUserMarker(currentPosition.lat, currentPosition.lng);
            }

            const recBtn = document.getElementById('btn-record-toggle');
            recBtn.disabled = true;
            document.getElementById('record-btn-label').textContent = '動画確定中...';

            await stopMediaRecordingAndFlush();

            recBtn.disabled = false;
            recBtn.className = 'flex-1 py-3 px-2.5 bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white rounded-xl font-extrabold text-xs shadow-lg shadow-rose-950/60 transition flex items-center justify-center gap-1.5 min-w-0';
            document.getElementById('record-btn-dot').className = 'w-2.5 h-2.5 rounded-full bg-white inline-block shrink-0';
            document.getElementById('record-btn-label').textContent = '記録開始';

            releaseScreenWakeLock();
            await prepareExportPanel();
        }

        // 6. Safe CAMM Metadata Track Builder & Binary Telemetry Generator
        // Append a self-contained binary CAMM trailer ('CAMMJSON' + JSON + length + 'CAMMEND!')
        // so MP4 files ALWAYS retain full GPS telemetry even when browser MediaRecorder outputs fragmented MP4s.
        async function appendCammTrailerToVideoBlob(videoBlob, points, mimeType) {
            const telemetryList = (points && points.length > 0) ? points : [{
                lat: currentPosition ? currentPosition.lat : 37.398,
                lng: currentPosition ? currentPosition.lng : 140.388,
                ele: 0,
                speed: 0,
                heading: 0,
                timestampOffsetMs: 0
            }];

            const payloadObj = {
                format: 'CAMM_GPS_TRAILER_V1',
                points: telemetryList.map(pt => ({
                    lat: pt.lat,
                    lng: pt.lng,
                    ele: pt.ele || 0,
                    speed: pt.speed || 0,
                    heading: pt.heading || 0,
                    timestampOffsetMs: pt.timestampOffsetMs || 0
                }))
            };

            const encoder = new TextEncoder();
            const jsonBytes = encoder.encode(JSON.stringify(payloadObj));
            const magicStart = encoder.encode('CAMMJSON');
            const magicEnd = encoder.encode('CAMMEND!');

            const footerBuf = new ArrayBuffer(12);
            const footerView = new DataView(footerBuf);
            footerView.setUint32(0, jsonBytes.byteLength, true);
            new Uint8Array(footerBuf, 4, 8).set(magicEnd);

            return new Blob([videoBlob, magicStart, jsonBytes, footerBuf], {
                type: mimeType || videoBlob.type || 'video/mp4'
            });
        }

        function buildRawCammBinary(points) {
            const telemetryList = points.length > 0 ? points : [{
                lat: currentPosition ? currentPosition.lat : 37.398,
                lng: currentPosition ? currentPosition.lng : 140.388,
                ele: 0,
                speed: 0,
                heading: 0,
                timestampOffsetMs: 0
            }];
            const totalBuf = new ArrayBuffer(telemetryList.length * 42);
            const view = new DataView(totalBuf);
            telemetryList.forEach((pt, idx) => {
                const offset = idx * 42;
                view.setFloat64(offset + 0, pt.timestampOffsetMs || 0, true);
                view.setUint16(offset + 8, 5, true);
                view.setFloat64(offset + 10, pt.lat, true);
                view.setFloat64(offset + 18, pt.lng, true);
                view.setFloat64(offset + 26, pt.ele || 0, true);
                view.setFloat32(offset + 34, pt.speed || 0, true);
                view.setFloat32(offset + 38, pt.heading || 0, true);
            });
            return new Blob([totalBuf], { type: 'application/octet-stream' });
        }

        async function buildCammEmbeddedMp4(rawBlob, points) {
            if (!rawBlob || rawBlob.size === 0) return null;

            const isMp4Container = rawBlob.type.toLowerCase().includes('mp4');
            const defaultExt = rawBlob.type.includes('webm') ? 'webm' : 'mp4';
            const defaultMime = rawBlob.type || (defaultExt === 'webm' ? 'video/webm' : 'video/mp4');

            if (!isMp4Container || typeof MP4Box === 'undefined') {
                const taggedBlob = await appendCammTrailerToVideoBlob(rawBlob, points, defaultMime);
                return {
                    blob: taggedBlob,
                    embedded: true,
                    extension: defaultExt,
                    mimeType: defaultMime
                };
            }

            try {
                const arrayBuffer = await rawBlob.arrayBuffer();
                return await new Promise((resolve) => {
                    try {
                        const inputMp4 = MP4Box.createFile();

                        inputMp4.onReady = async function (info) {
                            try {
                                const outMp4 = MP4Box.createFile();
                                const timescale = 1000;
                                const vTrack = info.videoTracks && info.videoTracks[0];

                                if (!vTrack || !vTrack.nb_samples || vTrack.nb_samples === 0) {
                                    const taggedBlob = await appendCammTrailerToVideoBlob(rawBlob, points, 'video/mp4');
                                    resolve({ blob: taggedBlob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' });
                                    return;
                                }

                                outMp4.addTrack({
                                    type: 'vide',
                                    width: vTrack.video.width,
                                    height: vTrack.video.height,
                                    timescale: vTrack.timescale,
                                    avcDecoderConfigRecord: vTrack.avcDecoderConfigRecord
                                });

                                const cammTrackId = outMp4.addTrack({
                                    type: 'meta',
                                    subtype: 'camm',
                                    timescale: timescale,
                                    description: 'Google CAMM GPS Telemetry Track'
                                });

                                const telemetryList = points.length > 0 ? points : [{
                                    lat: currentPosition ? currentPosition.lat : 37.398,
                                    lng: currentPosition ? currentPosition.lng : 140.388,
                                    ele: 0,
                                    speed: 0,
                                    heading: 0,
                                    timestampOffsetMs: 0
                                }];

                                for (let i = 0; i < telemetryList.length; i++) {
                                    const pt = telemetryList[i];
                                    const buf = new ArrayBuffer(34);
                                    const view = new DataView(buf);
                                    view.setUint16(0, 5, true);
                                    view.setFloat64(2, pt.lat, true);
                                    view.setFloat64(10, pt.lng, true);
                                    view.setFloat64(18, pt.ele || 0, true);
                                    view.setFloat32(26, pt.speed || 0, true);
                                    view.setFloat32(30, pt.heading || 0, true);

                                    const durationMs = (i < telemetryList.length - 1)
                                        ? Math.max(10, telemetryList[i + 1].timestampOffsetMs - pt.timestampOffsetMs)
                                        : 1000;

                                    outMp4.addSample(cammTrackId, buf, {
                                        duration: durationMs,
                                        is_sync: true
                                    });
                                }

                                const outBuffer = outMp4.getBuffer();
                                if (!outBuffer || outBuffer.byteLength < Math.max(10240, rawBlob.size * 0.5)) {
                                    const taggedBlob = await appendCammTrailerToVideoBlob(rawBlob, points, 'video/mp4');
                                    resolve({ blob: taggedBlob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' });
                                    return;
                                }

                                const muxedBlob = new Blob([outBuffer], { type: 'video/mp4' });
                                const finalMp4Blob = await appendCammTrailerToVideoBlob(muxedBlob, points, 'video/mp4');
                                resolve({ blob: finalMp4Blob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' });
                            } catch (innerErr) {
                                console.warn('CAMM muxing fallback to trailer-embedded MP4:', innerErr);
                                const taggedBlob = await appendCammTrailerToVideoBlob(rawBlob, points, 'video/mp4');
                                resolve({ blob: taggedBlob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' });
                            }
                        };

                        inputMp4.onError = async function () {
                            const taggedBlob = await appendCammTrailerToVideoBlob(rawBlob, points, 'video/mp4');
                            resolve({ blob: taggedBlob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' });
                        };

                        arrayBuffer.fileStart = 0;
                        inputMp4.appendBuffer(arrayBuffer);
                        inputMp4.flush();
                    } catch (err) {
                        appendCammTrailerToVideoBlob(rawBlob, points, 'video/mp4').then(taggedBlob => {
                            resolve({ blob: taggedBlob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' });
                        });
                    }
                });
            } catch (outerErr) {
                const taggedBlob = await appendCammTrailerToVideoBlob(rawBlob, points, 'video/mp4');
                return { blob: taggedBlob, embedded: true, extension: 'mp4', mimeType: 'video/mp4' };
            }
        }

        // 7. User-Selectable Save Destination Helper
        async function saveFileWithPicker(blob, suggestedName, mimeType, extension, descriptionText) {
            const shareCheckbox = document.getElementById('chk-use-share-sheet');
            const useShareSheet = shareCheckbox && shareCheckbox.checked;

            if (useShareSheet && typeof navigator.share === 'function' && navigator.canShare) {
                try {
                    const fileObj = new File([blob], suggestedName, { type: mimeType });
                    if (navigator.canShare({ files: [fileObj] })) {
                        await navigator.share({
                            files: [fileObj],
                            title: suggestedName
                        });
                        return { method: 'share', filename: suggestedName };
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        return { method: 'cancelled', filename: suggestedName };
                    }
                    console.warn('Share sheet fallback to picker/download:', err);
                }
            }

            if (typeof window.showSaveFilePicker === 'function') {
                try {
                    const acceptObj = {};
                    acceptObj[mimeType] = [`.${extension}`];
                    const handle = await window.showSaveFilePicker({
                        suggestedName: suggestedName,
                        types: [{
                            description: descriptionText || 'Recorded File',
                            accept: acceptObj
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return { method: 'picker', filename: handle.name || suggestedName };
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        return { method: 'cancelled', filename: suggestedName };
                    }
                    console.warn('showSaveFilePicker fallback to standard download:', err);
                }
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = suggestedName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 3000);
            return { method: 'download', filename: suggestedName };
        }
