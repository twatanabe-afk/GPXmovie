<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Tracker & CAMM Video Recorder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

    <!-- JSZip v3.10.1 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- toGeoJSON v5.5.0 -->
    <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.5.0/dist/togeojson.umd.js"></script>

    <!-- MP4Box.js v0.5.2 (CAMM GPS Metadata Track Embedding) -->
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        #workspace-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .main-map-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Floating Camera Window (PiP Default) */
        .camera-window-container {
            position: fixed;
            top: 146px;
            left: 12px;
            width: 172px;
            height: 224px;
            z-index: 25;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            border: 1.5px solid rgba(56, 189, 248, 0.45);
            background: #020617;
        }

        @media (min-width: 640px) {
            .camera-window-container {
                width: 240px;
                height: 180px;
            }
        }

        /* Resize Handle for PiP Camera Window */
        .cam-resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 28px;
            height: 28px;
            z-index: 30;
            cursor: nwse-resize;
            touch-action: none;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 4px;
            background: linear-gradient(135deg, transparent 50%, rgba(56, 189, 248, 0.55) 50%);
            border-bottom-right-radius: 0.9rem;
        }
        .camera-fullscreen .cam-resize-handle,
        .view-mode-split .cam-resize-handle {
            display: none !important;
        }

        /* Fullscreen Camera Mode */
        .camera-window-container.camera-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 15 !important;
        }

        /* 50/50 Split View Mode */
        .view-mode-split {
            display: flex !important;
            flex-direction: column;
            height: calc(100vh - var(--bottom-panel-offset, 140px)) !important;
            height: calc(100dvh - var(--bottom-panel-offset, 140px)) !important;
            max-height: calc(100dvh - var(--bottom-panel-offset, 140px)) !important;
            width: 100vw;
            overflow: hidden;
            transition: height 0.2s ease, max-height 0.2s ease;
        }
        @media (min-width: 768px) {
            .view-mode-split {
                flex-direction: row;
            }
        }
        .view-mode-split .main-map-container {
            position: relative !important;
            flex: 1 1 50% !important;
            width: 100% !important;
            height: 50% !important;
            min-height: 0 !important;
            z-index: 1 !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.18);
        }
        .view-mode-split .camera-window-container {
            position: relative !important;
            flex: 1 1 50% !important;
            width: 100% !important;
            height: 50% !important;
            min-height: 0 !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
            border-radius: 0 !important;
        }
        @media (min-width: 768px) {
            .view-mode-split .main-map-container,
            .view-mode-split .camera-window-container {
                width: 50vw !important;
                height: 100% !important;
                border-bottom: none;
            }
            .view-mode-split .main-map-container {
                border-right: 2px solid rgba(255, 255, 255, 0.18);
            }
        }

        /* Recording Pulse Ring Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.9; }
            70% { transform: scale(2.4); opacity: 0; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .pulse-ring {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 9999px;
            background-color: rgba(244, 63, 94, 0.65);
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Hide default Leaflet attribution clutter on tiny screens */
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.65) !important;
            color: #94a3b8 !important;
            font-size: 9px !important;
        }
        .leaflet-control-attribution a {
            color: #38bdf8 !important;
        }
    </style>
</head>
<body>

    <div id="workspace-root">
        <!-- FULLSCREEN LEAFLET MAP -->
        <div id="map" class="main-map-container"></div>

        <!-- CAMERA VIEWFINDER WINDOW (Draggable PiP / Split / Fullscreen) -->
        <div id="camera-window" class="camera-window-container flex flex-col">
            <!-- Drag Handle & Camera Flip Header -->
            <div id="cam-drag-header" class="flex items-center justify-between px-2.5 py-1.5 bg-slate-950/90 border-b border-slate-800 cursor-move select-none z-10">
                <span class="text-[10px] font-extrabold text-cyan-400 flex items-center gap-1">
                    <i class="fa-solid fa-video"></i> CAM
                </span>
                <button id="btn-switch-camera" type="button" title="イン/アウトカメラ切替" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs flex items-center justify-center">
                    <i class="fa-solid fa-camera-rotate"></i>
                </button>
            </div>

            <!-- Video Stream Element -->
            <div class="relative flex-1 w-full h-full bg-black overflow-hidden">
                <video id="camera-preview" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <video id="camm-playback-video" playsinline class="w-full h-full object-contain bg-black hidden"></video>

                <!-- Live REC Badge + Timer -->
                <div id="cam-rec-badge" class="absolute top-2 left-2 px-2 py-0.5 bg-rose-600/95 text-[10px] font-bold rounded-full text-white hidden flex items-center gap-1.5 shadow-lg">
                    <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
                    <span>REC</span>
                    <span id="cam-rec-timer" class="font-mono">00:00</span>
                </div>

                <!-- Playback Mode Badge -->
                <div id="cam-playback-badge" class="absolute top-2 left-2 px-2 py-0.5 bg-cyan-600/95 text-[10px] font-bold rounded-full text-white hidden flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-film"></i>
                    <span>CAMM再生中</span>
                </div>

                <!-- Live Video Buffer Size Badge -->
                <div id="cam-size-badge" class="absolute top-2 right-2 px-2 py-0.5 bg-slate-900/85 border border-cyan-500/40 text-[10px] font-mono rounded-full text-cyan-300 hidden">
                    0.0 MB
                </div>

                <!-- GPS Fix Indicator inside Camera -->
                <div id="cam-gps-badge" class="absolute bottom-2 left-2 px-2 py-0.5 bg-slate-900/80 border border-slate-700/80 text-[10px] font-mono rounded-md text-emerald-400">
                    GPS: 測位中...
                </div>

                <!-- Corner Resize Handle -->
                <div id="cam-resize-handle" class="cam-resize-handle" title="ドラッグでサイズ変更">
                    <i class="fa-solid fa-up-right-and-down-left-from-center text-[9px] text-white rotate-90 drop-shadow"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION BANNER -->
    <div id="toast-banner" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md glass-panel border border-cyan-500/40 rounded-2xl p-3.5 shadow-2xl hidden transition-all duration-300">
        <div class="flex items-start gap-3">
            <div id="toast-icon" class="text-lg mt-0.5">✅</div>
            <div class="flex-1 min-w-0">
                <div id="toast-title" class="text-xs font-extrabold text-white truncate">保存完了</div>
                <div id="toast-desc" class="text-[11px] text-slate-300 mt-0.5 leading-relaxed"></div>
            </div>
            <button id="toast-close" type="button" class="text-slate-400 hover:text-white px-1.5 py-0.5 text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- TOP CENTER LIVE TELEMETRY HUD -->
    <div id="top-telemetry-hud" class="fixed top-3 left-1/2 -translate-x-1/2 z-20 w-[94%] max-w-lg glass-panel rounded-2xl px-3.5 py-2 pointer-events-none">
        <div class="grid grid-cols-4 gap-2 text-center">
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">TIME</div>
                <div id="hud-elapsed" class="text-sm font-extrabold font-mono text-white">00:00</div>
            </div>
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">DIST</div>
                <div id="hud-distance" class="text-sm font-extrabold font-mono text-cyan-300">0.00 <span class="text-[10px] font-normal">km</span></div>
            </div>
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">SPEED</div>
                <div id="hud-speed" class="text-sm font-extrabold font-mono text-emerald-300">0.0 <span class="text-[10px] font-normal">km/h</span></div>
            </div>
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">VIDEO</div>
                <div id="hud-video-size" class="text-sm font-extrabold font-mono text-rose-300">0.0 <span class="text-[10px] font-normal">MB</span></div>
            </div>
        </div>
    </div>

    <!-- TOP LEFT FIXED SINGLE LAYOUT TOGGLE BUTTON (44x44px) -->
    <div class="fixed top-[92px] left-3 z-20 flex flex-col gap-2">
        <button id="btn-cycle-layout" type="button" title="表示レイアウト切替 (地図 / 分割 / カメラ)" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-lg shadow-lg transition">
            <span id="icon-cycle-layout">🗺️</span>
        </button>
    </div>

    <!-- TOP RIGHT ACTION BUTTONS (44x44px Vertical Stack) -->
    <div class="fixed top-[92px] right-3 z-20 flex flex-col gap-2">
        <button id="btn-zoom-in" type="button" title="拡大" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-lg font-extrabold text-white shadow-lg transition">＋</button>
        <button id="btn-zoom-out" type="button" title="縮小" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-lg font-extrabold text-white shadow-lg transition">－</button>
        <button id="btn-map-layers" type="button" title="背景地図切替" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-base shadow-lg transition">🗺️</button>
        <button id="btn-track-style" type="button" title="軌跡スタイル設定" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-base shadow-lg transition">🎨</button>
        <button id="btn-toggle-cam-overlay" type="button" title="カメラ小窓表示切替" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-sm text-cyan-300 shadow-lg transition">
            <i id="icon-toggle-cam-overlay" class="fa-solid fa-video"></i>
        </button>
        <button id="btn-open-camm-file" type="button" title="CAMM動画/ZIP読込" class="w-11 h-11 rounded-xl glass-panel hover:bg-slate-800/90 active:scale-95 flex items-center justify-center text-sm text-amber-300 shadow-lg transition">
            <i class="fa-solid fa-folder-open"></i>
        </button>
    </div>

    <!-- HIDDEN FILE INPUT (iOS Safari compatible: no accept attribute) -->
    <input id="input-camm-file" type="file" class="hidden" />

    <!-- BOTTOM CONTROL PANEL -->
    <div id="bottom-control-panel" class="fixed bottom-0 left-0 right-0 z-30 glass-panel rounded-t-2xl border-t border-slate-700/80 px-3 pt-1.5 pb-2.5 shadow-2xl">
        <!-- Collapse / Expand Handle Bar -->
        <button id="btn-collapse-bottom" type="button" class="w-full flex items-center justify-center gap-1.5 py-1 text-[11px] font-bold text-slate-300 hover:text-white">
            <span id="collapse-icon">▼</span>
            <span id="collapse-label">メニューを折りたたむ</span>
        </button>

        <div id="bottom-panel-body" class="space-y-2 mt-1">
            <!-- Slim CAMM Playback Bar (Shown when CAMM video/ZIP is loaded) -->
            <div id="camm-player-panel" class="hidden bg-slate-900/90 border border-cyan-500/40 rounded-xl px-2.5 py-2 space-y-1.5">
                <div class="flex items-center justify-between gap-2 text-[10px]">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <span class="px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold shrink-0">CAMM</span>
                        <span id="camm-loaded-title" class="font-bold text-slate-100 truncate">file.mp4</span>
                        <span id="camm-telemetry-badge" class="text-cyan-400 font-mono shrink-0">0 pt</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span id="camm-point-index-readout" class="font-mono text-slate-400">pt 0 / 0</span>
                        <button id="btn-close-camm-player" type="button" title="プレイヤーを閉じる" class="text-slate-400 hover:text-rose-400 px-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="btn-camm-play-pause" type="button" class="w-8 h-8 rounded-lg bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white flex items-center justify-center shrink-0 text-xs">
                        <i id="icon-camm-play-pause" class="fa-solid fa-play"></i>
                    </button>
                    <span id="camm-time-current" class="text-[10px] font-mono text-slate-200 w-12 text-right shrink-0">00:00.0</span>
                    <input id="slider-camm-seek" type="range" min="0" max="100" step="0.05" value="0" class="flex-1 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400" />
                    <span id="camm-time-total" class="text-[10px] font-mono text-slate-400 w-12 shrink-0">00:00.0</span>
                </div>
                <div id="camm-coord-readout" class="text-[10px] font-mono text-slate-400 text-right truncate">---</div>
            </div>

            <!-- Primary Action Row -->
            <div class="grid grid-cols-12 gap-2">
                <button id="btn-track-mode" type="button" class="col-span-4 py-2.5 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600/80 text-[11px] font-extrabold text-cyan-300 truncate transition">
                    追尾: 現在地
                </button>
                <button id="btn-record-toggle" type="button" class="col-span-5 py-2.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 active:scale-95 text-xs font-extrabold text-white shadow-lg flex items-center justify-center gap-1.5 transition">
                    <span class="w-2.5 h-2.5 rounded-full bg-white"></span>
                    <span id="record-btn-label">記録開始</span>
                </button>
                <button id="btn-load-camm-inline" type="button" class="col-span-3 py-2.5 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600/80 text-[11px] font-bold text-amber-300 truncate transition">
                    📂 読込
                </button>
            </div>

            <!-- Export Trigger Row (Shown after recording stops) -->
            <button id="btn-open-export-modal" type="button" class="hidden w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 active:scale-98 text-xs font-extrabold text-white shadow-lg flex items-center justify-center gap-2 transition">
                <span>💾 記録データの保存・出力を開く</span>
            </button>

            <!-- Footer Status & Version -->
            <div class="flex items-center justify-between text-[10px] text-slate-400 pt-0.5">
                <span id="wake-lock-indicator">WakeLock: 待機中 / GPS: 0 pt</span>
                <span class="font-mono text-slate-400">v2026.11.20.0841</span>
            </div>
        </div>
    </div>

    <!-- MODAL: BASEMAP LAYER SWITCHER -->
    <div id="modal-map-layers" class="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl w-full max-w-sm p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2">
                <h3 class="text-sm font-extrabold text-white">🗺️ 背景地図の切り替え</h3>
                <button id="close-map-modal" type="button" class="text-slate-400 hover:text-white px-2 py-1 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="basemap-list" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <!-- MODAL: TRACK STYLE CUSTOMIZER -->
    <div id="modal-track-style" class="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl w-full max-w-sm p-4 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2">
                <h3 class="text-sm font-extrabold text-white">🎨 走行軌跡スタイル設定</h3>
                <button id="close-style-modal" type="button" class="text-slate-400 hover:text-white px-2 py-1 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3 text-xs">
                <div class="flex items-center justify-between">
                    <label for="input-track-color" class="font-bold text-slate-200">ラインカラー</label>
                    <input id="input-track-color" type="color" value="#ff2d55" class="w-12 h-8 rounded bg-transparent cursor-pointer" />
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between font-bold text-slate-200">
                        <span>ライン太さ</span>
                        <span id="label-track-weight" class="font-mono text-cyan-300">10 px</span>
                    </div>
                    <input id="input-track-weight" type="range" min="1" max="20" value="10" class="w-full accent-cyan-400" />
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between font-bold text-slate-200">
                        <span>不透明度</span>
                        <span id="label-track-opacity" class="font-mono text-cyan-300">90 %</span>
                    </div>
                    <input id="input-track-opacity" type="range" min="10" max="100" value="90" class="w-full accent-cyan-400" />
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: EXPORT & SAVE DESTINATION -->
    <div id="modal-export-options" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl w-full max-w-md p-4 space-y-3.5">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2">
                <div>
                    <h3 class="text-sm font-extrabold text-white">💾 記録データの保存・出力</h3>
                    <span id="export-summary-badge" class="text-[11px] font-mono text-cyan-300">0 pt / 0.0 MB</span>
                </div>
                <button id="close-export-modal" type="button" class="text-slate-400 hover:text-white px-2 py-1 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Filename Input -->
            <div class="space-y-1">
                <label for="input-export-filename" class="text-[11px] font-bold text-slate-300">保存ファイル名 (拡張子自動付与)</label>
                <div class="flex gap-1.5">
                    <input id="input-export-filename" type="text" placeholder="CAMM_202611200835" class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-mono text-white focus:outline-none focus:border-cyan-400" />
                    <button id="btn-reset-export-filename" type="button" title="現在日時でリセット" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-200">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Share Sheet Toggle -->
            <label class="flex items-center gap-2 text-[11px] text-slate-300 bg-slate-900/70 px-3 py-2 rounded-xl border border-slate-800 cursor-pointer">
                <input id="chk-use-share-sheet" type="checkbox" class="rounded accent-cyan-400" />
                <span>OS共有シート経由で保存先を指定する (スマホ推奨)</span>
            </label>

            <!-- Export Buttons -->
            <div class="space-y-2 pt-1">
                <button id="btn-export-camm-mp4" type="button" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 active:scale-98 text-xs font-extrabold text-white shadow-lg flex items-center justify-between">
                    <span>📹 CAMM MP4動画を保存</span>

        let trackingMode = 0;

        let isRecording = false;
        let recordStartMs = 0;
        let recordedPoints = [];
        let totalDistanceMeters = 0;
        let watchId = null;
        let gpsFallbackInterval = null;
        let lastGpsFixMs = 0;
        let elapsedTimerInterval = null;
        let wakeLock = null;

        let mediaRecorder = null;
        let recordedChunks = [];
        let recordedBytesTotal = 0;
        let recordedVideoBlob = null;
        let cachedCammResult = null;

        let isCammPlaybackActive = false;
        let cammPlaybackPoints = [];
        let cammVideoObjectUrl = null;
        let isScrubbingCamm = false;
        let isDraggingPlaybackMarker = false;
        let cammPlaybackRafId = null;
        let cammKnownDurationSec = 0;

        let currentPosition = null;
        const trackStyle = {
            color: '#ff2d55',

        };

        const BASEMAPS = [
            {

            {

            },
            {
                id: 'gsi_seamlessphoto',

                url: 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
                attr: '&copy; 国土地理院',

            },

        // 1. Map Initialization
        function initMap() {
            const mapEl = document.getElementById('map');
            if (!mapEl || typeof L === 'undefined') return;

            map = L.map('map', {
                center: [37.398, 140.388],
                zoom: 13,
                zoomControl: false,
                attributionControl: true
            });

            setBasemap('gsi_pale');
            renderBasemapModalList();

            userPolyline = L.polyline([], {
                color: trackStyle.color,
                weight: trackStyle.weight,
                opacity: trackStyle.opacity,
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);

            cammPlaybackPolyline = L.polyline([], {
                color: '#00d2ff',
                weight: 8,
                opacity: 0.85,
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);

            // Wide transparent hit-target polyline for easy tapping/clicking on mobile & desktop
            cammPlaybackHitPolyline = L.polyline([], {
                color: '#00d2ff',
                weight: 28,
                opacity: 0.01,
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);

            cammPlaybackHitPolyline.on('click', (e) => {
                if (!isCammPlaybackActive || cammPlaybackPoints.length === 0) return;
                L.DomEvent.stopPropagation(e);
                seekCammToNearestLatLng(e.latlng);
            });
        }

        function setBasemap(basemapId) {
            const bm = BASEMAPS.find(b => b.id === basemapId) || BASEMAPS[0];
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            currentTileLayer = L.tileLayer(bm.url, {
                attribution: bm.attr,
                maxNativeZoom: bm.maxNativeZoom || 18,
                maxZoom: 21
            }).addTo(map);
        }

        function renderBasemapModalList() {
            const container = document.getElementById('basemap-list');
            if (!container) return;
            container.innerHTML = '';
            BASEMAPS.forEach(bm => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-full text-left px-4 py-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-xs font-bold text-slate-100 transition flex items-center justify-between';
                btn.innerHTML = `<span>${bm.name}</span><i class="fa-solid fa-chevron-right text-slate-500"></i>`;
                btn.addEventListener('click', () => {
                    setBasemap(bm.id);
                    document.getElementById('modal-map-layers').classList.add('hidden');
                });
                container.appendChild(btn);
            });
        }

        // 2. Camera & Multi-Layout Management
        async function startCamera() {
            const videoEl = document.getElementById('camera-preview');
            if (!videoEl) return;

            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: cameraFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: true
                });
                videoEl.srcObject = cameraStream;
            } catch (err) {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: cameraFacingMode },
                        audio: false
                    });
                    videoEl.srcObject = cameraStream;
                } catch (err2) {
                    console.warn('Camera unavailable:', err2);
                    const gpsBadge = document.getElementById('cam-gps-badge');
                    if (gpsBadge) {
                        gpsBadge.textContent = 'カメラ未接続 (GPSのみ記録可)';
                    }
                }
            }
        }

        async function switchCameraFacing() {
            if (isRecording) {
                showToast('録画中はカメラ切替不可', '録画を停止してからカメラを切り替えてください。', 'warning');
                return;
            }
            cameraFacingMode = cameraFacingMode === 'environment' ? 'user' : 'environment';
            await startCamera();
        }

        function setLayoutMode(mode) {
            currentLayoutMode = mode;
            const root = document.getElementById('workspace-root');
            const camBox = document.getElementById('camera-window');
            const cycleIcon = document.getElementById('icon-cycle-layout');
            if (!root || !camBox) return;

            root.classList.remove('view-mode-split');
            camBox.classList.remove('camera-fullscreen');
            camBox.style.left = '';
            camBox.style.top = '';
            if (mode !== 'map') {
                camBox.style.width = '';
                camBox.style.height = '';
            }

            if (cycleIcon) {
                cycleIcon.textContent = LAYOUT_ICONS[mode] || '🗺️';
            }

            if (mode === 'split') {
                root.classList.add('view-mode-split');
                camBox.classList.remove('hidden');
                isCameraVisible = true;
            } else if (mode === 'camera') {
                camBox.classList.add('camera-fullscreen');
                camBox.classList.remove('hidden');
                isCameraVisible = true;
            } else {
                if (isCameraVisible) {
                    camBox.classList.remove('hidden');
                }
            }

            const overlayIcon = document.getElementById('icon-toggle-cam-overlay');
            if (overlayIcon) {
                overlayIcon.className = isCameraVisible ? 'fa-solid fa-video' : 'fa-solid fa-video-slash text-slate-400';
            }

            updateSplitViewBottomOffset();
        }

        function cycleLayoutMode() {
            const idx = LAYOUT_MODES.indexOf(currentLayoutMode);
            const nextMode = LAYOUT_MODES[(idx + 1) % LAYOUT_MODES.length];
            setLayoutMode(nextMode);
        }

        function toggleBottomPanel() {
            const body = document.getElementById('bottom-panel-body');
            const icon = document.getElementById('collapse-icon');
            const label = document.getElementById('collapse-label');
            if (!body) return;

            isBottomCollapsed = !isBottomCollapsed;
            if (isBottomCollapsed) {
                body.classList.add('hidden');
                if (icon) icon.textContent = '▲';
                if (label) label.textContent = 'メニューを表示';
            } else {
                body.classList.remove('hidden');
                if (icon) icon.textContent = '▼';
                if (label) label.textContent = 'メニューを折りたたむ';
            }
            updateSplitViewBottomOffset();
        }

        function initPiPDragging() {
            const camBox = document.getElementById('camera-window');
            const header = document.getElementById('cam-drag-header');
            if (!camBox || !header) return;

            let isDragging = false;
            let offsetX = 0, offsetY = 0;

            const onStart = (clientX, clientY) => {
                if (currentLayoutMode !== 'map') return;
                isDragging = true;
                const rect = camBox.getBoundingClientRect();
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
            };

            const onMove = (clientX, clientY) => {
                if (!isDragging || currentLayoutMode !== 'map') return;
                const maxX = Math.max(0, window.innerWidth - camBox.offsetWidth);
                const maxY = Math.max(0, window.innerHeight - camBox.offsetHeight);
                const nextX = Math.max(0, Math.min(maxX, clientX - offsetX));
                const nextY = Math.max(0, Math.min(maxY, clientY - offsetY));
                camBox.style.left = `${Math.round(nextX)}px`;
                camBox.style.top = `${Math.round(nextY)}px`;
            };

            const onEnd = () => { isDragging = false; };

            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                e.preventDefault();
                onStart(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onEnd);

            header.addEventListener('touchstart', (e) => {
                if (e.target.closest('button') || !e.touches[0]) return;
                onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            header.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        function initPiPResizing() {
            const camBox = document.getElementById('camera-window');
            const handle = document.getElementById('cam-resize-handle');
            if (!camBox || !handle) return;

            let isResizing = false;
            let startX = 0, startY = 0, startW = 0, startH = 0;

            const onStart = (clientX, clientY) => {
                if (currentLayoutMode !== 'map') return;
                isResizing = true;
                const rect = camBox.getBoundingClientRect();
                startX = clientX;
                startY = clientY;
                startW = rect.width;
                startH = rect.height;
            };

            const onMove = (clientX, clientY) => {
                if (!isResizing || currentLayoutMode !== 'map') return;
                const rect = camBox.getBoundingClientRect();
                const maxW = Math.max(130, window.innerWidth - rect.left - 8);
                const maxH = Math.max(120, window.innerHeight - rect.top - 8);
                const newW = Math.max(130, Math.min(maxW, startW + (clientX - startX)));
                const newH = Math.max(120, Math.min(maxH, startH + (clientY - startY)));
                camBox.style.width = `${Math.round(newW)}px`;
                camBox.style.height = `${Math.round(newH)}px`;
            };

            const onEnd = () => { isResizing = false; };

            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                onStart(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onEnd);

            handle.addEventListener('touchstart', (e) => {
                if (!e.touches[0]) return;
                e.stopPropagation();
                onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (isResizing && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        function updateSplitViewBottomOffset() {
            const root = document.getElementById('workspace-root');
            const panel = document.getElementById('bottom-control-panel');
            if (!root || !panel) return;

            const rect = panel.getBoundingClientRect();
            const panelHeight = Math.ceil(rect.height || panel.offsetHeight || 0);
            const offsetPx = currentLayoutMode === 'split' ? panelHeight : 0;
            root.style.setProperty('--bottom-panel-offset', `${offsetPx}px`);

            requestAnimationFrame(() => {
                if (map) map.invalidateSize({ animate: false });
            });
        }

        function observeBottomPanelResize() {
            const panel = document.getElementById('bottom-control-panel');
            if (!panel) return;
            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => {
                    updateSplitViewBottomOffset();
                });
                ro.observe(panel);
            }
            window.addEventListener('resize', updateSplitViewBottomOffset);
            updateSplitViewBottomOffset();
        }

        function startCammPlaybackSyncLoop() {
            stopCammPlaybackSyncLoop();
            const playbackVideo = document.getElementById('camm-playback-video');
            const seekSlider = document.getElementById('slider-camm-seek');

            const tick = () => {
                if (!isCammPlaybackActive || !playbackVideo || playbackVideo.paused || playbackVideo.ended) {
                    cammPlaybackRafId = null;
                    return;
                }
                const cur = playbackVideo.currentTime || 0;
                if (!isScrubbingCamm && seekSlider) {
                    seekSlider.value = cur;
                }
                syncCammMapToTime(cur);
                cammPlaybackRafId = requestAnimationFrame(tick);
            };
            cammPlaybackRafId = requestAnimationFrame(tick);
        }

        function stopCammPlaybackSyncLoop() {
            if (cammPlaybackRafId !== null) {
                cancelAnimationFrame(cammPlaybackRafId);
                cammPlaybackRafId = null;
            }
        }

        function bindUIEvents() {
            document.getElementById('btn-zoom-in').addEventListener('click', () => map && map.zoomIn());
            document.getElementById('btn-zoom-out').addEventListener('click', () => map && map.zoomOut());

            document.getElementById('btn-map-layers').addEventListener('click', () => {
                document.getElementById('modal-map-layers').classList.remove('hidden');
            });
            document.getElementById('close-map-modal').addEventListener('click', () => {
                document.getElementById('modal-map-layers').classList.add('hidden');
            });

            document.getElementById('btn-track-style').addEventListener('click', () => {
                document.getElementById('modal-track-style').classList.remove('hidden');
            });
            document.getElementById('close-style-modal').addEventListener('click', () => {
                document.getElementById('modal-track-style').classList.add('hidden');
            });

            document.getElementById('btn-toggle-cam-overlay').addEventListener('click', () => {
                const camBox = document.getElementById('camera-window');
                const iconEl = document.getElementById('icon-toggle-cam-overlay');
                isCameraVisible = !isCameraVisible;
                if (isCameraVisible) {
                    camBox.classList.remove('hidden');
                    if (iconEl) iconEl.className = 'fa-solid fa-video';
                } else {
                    camBox.classList.add('hidden');
                    if (iconEl) iconEl.className = 'fa-solid fa-video-slash text-slate-400';
                }
            });

            document.getElementById('btn-switch-camera').addEventListener('click', switchCameraFacing);
            document.getElementById('btn-cycle-layout').addEventListener('click', cycleLayoutMode);

            document.getElementById('btn-collapse-bottom').addEventListener('click', toggleBottomPanel);

            document.getElementById('btn-track-mode').addEventListener('click', () => {
                trackingMode = (trackingMode + 1) % TRACKING_LABELS.length;
                document.getElementById('btn-track-mode').textContent = TRACKING_LABELS[trackingMode];
                applyTrackingCamera();
            });

            document.getElementById('btn-record-toggle').addEventListener('click', toggleRecording);

            document.getElementById('btn-open-export-modal').addEventListener('click', () => {
                const filenameInput = document.getElementById('input-export-filename');
                if (filenameInput && !filenameInput.value.trim()) {
                    filenameInput.value = `CAMM_${formatFilenameTimestamp()}`;
                }
                document.getElementById('modal-export-options').classList.remove('hidden');
            });
            document.getElementById('close-export-modal').addEventListener('click', () => {
                document.getElementById('modal-export-options').classList.add('hidden');
            });
            document.getElementById('btn-reset-export-filename').addEventListener('click', () => {
                const filenameInput = document.getElementById('input-export-filename');
                if (filenameInput) {
                    filenameInput.value = `CAMM_${formatFilenameTimestamp()}`;
                }
            });

            document.getElementById('btn-export-camm-mp4').addEventListener('click', handleExportCammMp4);
            document.getElementById('btn-export-zip').addEventListener('click', handleExportZipBundle);
            document.getElementById('btn-export-gpx').addEventListener('click', handleExportGpx);

            document.getElementById('toast-close').addEventListener('click', () => {
                document.getElementById('toast-banner').classList.add('hidden');
            });

            // CAMM File Import & Playback Scrubber Bindings
            const fileInput = document.getElementById('input-camm-file');
            document.getElementById('btn-open-camm-file').addEventListener('click', () => fileInput.click());
            document.getElementById('btn-load-camm-inline').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleCammFileSelected);

            document.getElementById('btn-camm-play-pause').addEventListener('click', toggleCammPlayPause);
            document.getElementById('btn-close-camm-player').addEventListener('click', closeCammPlayer);

            const seekSlider = document.getElementById('slider-camm-seek');
            const playbackVideo = document.getElementById('camm-playback-video');

            seekSlider.addEventListener('input', (e) => {
                isScrubbingCamm = true;
                const targetSec = parseFloat(e.target.value) || 0;
                const effectiveDur = getEffectiveCammVideoDuration();
                if (playbackVideo && effectiveDur > 0) {
                    playbackVideo.currentTime = Math.min(effectiveDur, Math.max(0, targetSec));
                }
                syncCammMapToTime(targetSec);
            });

            seekSlider.addEventListener('change', () => {
                isScrubbingCamm = false;
            });

            const updateResolvedVideoDuration = () => {
                let dur = playbackVideo.duration;
                if (Number.isFinite(dur) && dur > 0) {
                    cammKnownDurationSec = dur;
                } else if (cammPlaybackPoints.length > 0) {
                    const lastOffsetSec = (cammPlaybackPoints[cammPlaybackPoints.length - 1].timestampOffsetMs || 0) / 1000;
                    dur = lastOffsetSec > 0 ? lastOffsetSec : Math.max(1, cammPlaybackPoints.length - 1);
                    cammKnownDurationSec = dur;
                } else {
                    dur = 100;
                }
                seekSlider.max = dur;
                document.getElementById('camm-time-total').textContent = formatMMSSDecimal(dur);
            };

            playbackVideo.addEventListener('loadedmetadata', () => {
                updateResolvedVideoDuration();
                syncCammMapToTime(0);
            });

            playbackVideo.addEventListener('durationchange', () => {
                updateResolvedVideoDuration();
                syncCammMapToTime(playbackVideo.currentTime || 0);
            });

            playbackVideo.addEventListener('timeupdate', () => {
                const cur = playbackVideo.currentTime || 0;
                if (!isScrubbingCamm) {
                    if (cur > parseFloat(seekSlider.max)) {
                        seekSlider.max = cur;
                    }
                    seekSlider.value = cur;
                }
                syncCammMapToTime(cur);
            });

            playbackVideo.addEventListener('play', () => {
                document.getElementById('icon-camm-play-pause').className = 'fa-solid fa-pause';
                startCammPlaybackSyncLoop();
            });

            playbackVideo.addEventListener('pause', () => {
                document.getElementById('icon-camm-play-pause').className = 'fa-solid fa-play';
                stopCammPlaybackSyncLoop();
            });

            playbackVideo.addEventListener('ended', () => {
                document.getElementById('icon-camm-play-pause').className = 'fa-solid fa-play';
                stopCammPlaybackSyncLoop();
            });
        }

        // 9B. CAMM MP4 / ZIP Loader, Parser & Map Synchronizer
        async function handleCammFileSelected(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;

            if (isRecording) {
                showToast('録画中は読み込み不可', '現在の記録を停止してからファイルを読み込んでください。', 'warning');
                return;
            }

            const lowerName = file.name.toLowerCase();
            const isMp4 = lowerName.endsWith('.mp4') || lowerName.endsWith('.mov') || lowerName.endsWith('.m4v') || lowerName.endsWith('.webm');
            const isZip = lowerName.endsWith('.zip');

            if (!isMp4 && !isZip) {
                showToast('非対応ファイル形式', 'CAMM形式のMP4動画、またはCAMMセッションZIPファイルを選択してください。', 'warning');
                return;
            }

            try {
                let videoBlob = null;
                let extractedPoints = [];

                if (isZip) {
                    const zip = await JSZip.loadAsync(file);
                    let videoEntry = null;
                    let jsonEntry = null;
                    let cammBinEntry = null;
                    let gpxEntry = null;

                    zip.forEach((relPath, entry) => {
                        if (entry.dir) return;
                        const low = relPath.toLowerCase();
                        if (!videoEntry && (low.endsWith('.mp4') || low.endsWith('.webm'))) videoEntry = entry;
                        if (low.endsWith('telemetry.json')) jsonEntry = entry;
                        if (low.endsWith('.camm.bin')) cammBinEntry = entry;
                        if (low.endsWith('.gpx')) gpxEntry = entry;
                    });

                    if (videoEntry) {
                        const vBuf = await videoEntry.async('arraybuffer');
                        videoBlob = new Blob([vBuf], { type: videoEntry.name.toLowerCase().endsWith('.webm') ? 'video/webm' : 'video/mp4' });
                    }

                    if (cammBinEntry) {
                        const binBuf = await cammBinEntry.async('arraybuffer');
                        extractedPoints = parseRawCammBinaryBuffer(binBuf);
                    } else if (jsonEntry) {
                        const jsonText = await jsonEntry.async('text');
                        const parsed = JSON.parse(jsonText);
                        if (Array.isArray(parsed.points)) {
                            extractedPoints = parsed.points;
                        }
                    } else if (gpxEntry) {
                        const gpxText = await gpxEntry.async('text');
                        extractedPoints = parseGpxToTelemetryPoints(gpxText);
                    }

                    if (extractedPoints.length === 0 && videoBlob) {
                        const vBuf = await videoBlob.arrayBuffer();
                        extractedPoints = await extractCammSamplesFromMp4Buffer(vBuf);
                    }
                } else {
                    videoBlob = file;
                    const arrayBuf = await file.arrayBuffer();
                    extractedPoints = await extractCammSamplesFromMp4Buffer(arrayBuf);
                }

                if (!videoBlob) {
                    showToast('動画が見つかりません', 'ファイル内に再生可能な動画データが含まれていませんでした。', 'warning');
                    return;
                }

                activateCammPlaybackSession(file.name, videoBlob, extractedPoints);
            } catch (err) {
                console.error('CAMM file load error:', err);
                showToast('読み込みエラー', `ファイルの解析に失敗しました: ${err.message}`, 'warning');
            }
        }

        function parseRawCammBinaryBuffer(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            const recordSize = 42;
            const count = Math.floor(arrayBuffer.byteLength / recordSize);
            const pts = [];

            for (let i = 0; i < count; i++) {
                const offset = i * recordSize;
                const tsMs = view.getFloat64(offset + 0, true);
                const packetType = view.getUint16(offset + 8, true);
                if (packetType === 5) {
                    const lat = view.getFloat64(offset + 10, true);
                    const lng = view.getFloat64(offset + 18, true);
                    const ele = view.getFloat64(offset + 26, true);
                    const speed = view.getFloat32(offset + 34, true);
                    const heading = view.getFloat32(offset + 38, true);
                    if (Number.isFinite(lat) && Number.isFinite(lng)) {
                        pts.push({ lat, lng, ele, speed, heading, timestampOffsetMs: tsMs });
                    }
                }
            }
            return pts;
        }

        function parseGpxToTelemetryPoints(gpxText) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(gpxText, 'application/xml');
                const trkpts = Array.from(xmlDoc.getElementsByTagName('trkpt'));
                if (trkpts.length === 0) return [];

                let baseTimeMs = null;
                return trkpts.map((pt, idx) => {
                    const lat = parseFloat(pt.getAttribute('lat'));
                    const lng = parseFloat(pt.getAttribute('lon'));
                    const eleEl = pt.getElementsByTagName('ele')[0];
                    const timeEl = pt.getElementsByTagName('time')[0];
                    const ele = eleEl ? parseFloat(eleEl.textContent) || 0 : 0;

                    let timestampOffsetMs = idx * 1000;
                    if (timeEl && timeEl.textContent) {
                        const tMs = Date.parse(timeEl.textContent);
                        if (!Number.isNaN(tMs)) {
                            if (baseTimeMs === null) baseTimeMs = tMs;
                            timestampOffsetMs = Math.max(0, tMs - baseTimeMs);
                        }
                    }

                    return { lat, lng, ele, speed: 0, heading: 0, timestampOffsetMs };
                }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
            } catch (err) {
                console.warn('GPX parse error:', err);
                return [];
            }
        }

        function parseCammTrailerFromArrayBuffer(arrayBuffer) {
            try {
                if (!arrayBuffer || arrayBuffer.byteLength < 20) return [];
                const totalLen = arrayBuffer.byteLength;
                const decoder = new TextDecoder();

                // Search backward up to 512KB from EOF in case OS/browser appended trailing padding
                const bytes = new Uint8Array(arrayBuffer);
                const searchLimit = Math.max(0, totalLen - 524288);
                for (let pos = totalLen - 8; pos >= searchLimit; pos--) {
                    if (
                        bytes[pos] === 0x43 && // 'C'
                        bytes[pos + 1] === 0x41 && // 'A'
                        bytes[pos + 2] === 0x4D && // 'M'
                        bytes[pos + 3] === 0x4D && // 'M'
                        bytes[pos + 4] === 0x45 && // 'E'
                        bytes[pos + 5] === 0x4E && // 'N'
                        bytes[pos + 6] === 0x44 && // 'D'
                        bytes[pos + 7] === 0x21    // '!'
                    ) {
                        const lenView = new DataView(arrayBuffer, pos - 4, 4);
                        const jsonByteLen = lenView.getUint32(0, true);
                        const startMagicOffset = pos - 4 - jsonByteLen - 8;
                        if (startMagicOffset >= 0) {
                            const startMagic = decoder.decode(new Uint8Array(arrayBuffer, startMagicOffset, 8));
                            if (startMagic === 'CAMMJSON') {
                                const jsonBytes = new Uint8Array(arrayBuffer, startMagicOffset + 8, jsonByteLen);
                                const parsed = JSON.parse(decoder.decode(jsonBytes));
                                if (parsed && Array.isArray(parsed.points)) {
                                    return parsed.points.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.warn('CAMM trailer parse error:', err);
            }
            return [];
        }

        function extractCammSamplesFromMp4Buffer(arrayBuffer) {
            const trailerPoints = parseCammTrailerFromArrayBuffer(arrayBuffer);
            if (trailerPoints.length > 0) {
                return Promise.resolve(trailerPoints);
            }

            return new Promise((resolve) => {
                if (typeof MP4Box === 'undefined') {
                    resolve([]);
                    return;
                }

                try {
                    const mp4boxfile = MP4Box.createFile();
                    const extracted = [];
                    let cammTrackId = null;
                    let cammTimescale = 1000;
                    let accumulatedTicks = 0;

                    mp4boxfile.onReady = function (info) {
                        const tracks = info.tracks || [];
                        const cammTrack = tracks.find(t =>
                            (t.codec && t.codec.toLowerCase().includes('camm')) ||
                            (t.type && t.type.toLowerCase() === 'meta') ||
                            (t.name && t.name.toLowerCase().includes('camm'))
                        );

                        if (!cammTrack) {
                            resolve([]);
                            return;
                        }

                        cammTrackId = cammTrack.id;
                        cammTimescale = cammTrack.timescale || 1000;
                        mp4boxfile.setExtractionOptions(cammTrackId, null, { nbSamples: 50000 });
                        mp4boxfile.start();
                    };

                    mp4boxfile.onSamples = function (id, user, samples) {
                        if (id !== cammTrackId || !Array.isArray(samples)) return;
                        for (const s of samples) {
                            const data = s.data;
                            if (data && data.byteLength >= 34) {
                                const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
                                const packetType = view.getUint16(0, true);
                                if (packetType === 5) {
                                    const lat = view.getFloat64(2, true);
                                    const lng = view.getFloat64(10, true);
                                    const ele = view.getFloat64(18, true);
                                    const speed = view.getFloat32(26, true);
                                    const heading = view.getFloat32(30, true);
                                    const dtsTicks = (typeof s.dts === 'number') ? s.dts : accumulatedTicks;
                                    const timestampOffsetMs = (dtsTicks / cammTimescale) * 1000;

                                    if (Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
                                        extracted.push({ lat, lng, ele, speed, heading, timestampOffsetMs });
                                    }
                                }
                            }
                            accumulatedTicks += (s.duration || 1000);
                        }
                    };

                    mp4boxfile.onError = function () {
                        resolve(extracted);
                    };

                    const copyBuf = arrayBuffer.slice(0);
                    copyBuf.fileStart = 0;
                    mp4boxfile.appendBuffer(copyBuf);
                    mp4boxfile.flush();

                    setTimeout(() => {
                        extracted.sort((a, b) => a.timestampOffsetMs - b.timestampOffsetMs);
                        resolve(extracted);
                    }, 250);
                } catch (err) {
                    console.warn('MP4Box CAMM extraction error:', err);
                    resolve([]);
                }
            });
        }

        function normalizeCammTelemetryPoints(rawPoints) {
            if (!Array.isArray(rawPoints) || rawPoints.length === 0) return [];
            const pts = rawPoints.map((p, idx) => ({
                lat: Number(p.lat),
                lng: Number(p.lng),
                ele: Number(p.ele) || 0,
                speed: Number(p.speed) || 0,
                heading: Number(p.heading) || 0,
                timestampOffsetMs: Number.isFinite(Number(p.timestampOffsetMs)) ? Number(p.timestampOffsetMs) : idx * 1000
            })).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));

            if (pts.length <= 1) return pts;

            // Ensure monotonically increasing timestamps; if all timestamps are equal (e.g., 0), distribute evenly
            const firstTs = pts[0].timestampOffsetMs;
            const lastTs = pts[pts.length - 1].timestampOffsetMs;
            if (lastTs <= firstTs) {
                pts.forEach((p, idx) => {
                    p.timestampOffsetMs = idx * 1000;
                });
            } else if (firstTs > 0) {
                pts.forEach(p => {
                    p.timestampOffsetMs = Math.max(0, p.timestampOffsetMs - firstTs);
                });
            }
            return pts;
        }

        function computeTotalTrackMeters(pts) {
            if (!pts || pts.length < 2) return 0;
            let sum = 0;
            for (let i = 1; i < pts.length; i++) {
                sum += haversineDistance(pts[i - 1].lat, pts[i - 1].lng, pts[i].lat, pts[i].lng);
            }
            return sum;
        }

        function activateCammPlaybackSession(filename, videoBlob, points) {
            isCammPlaybackActive = true;
            cammPlaybackPoints = normalizeCammTelemetryPoints(points);
            cammKnownDurationSec = cammPlaybackPoints.length > 0
                ? Math.max(0.1, (cammPlaybackPoints[cammPlaybackPoints.length - 1].timestampOffsetMs || 0) / 1000)
                : 0;

            if (cammVideoObjectUrl) {
                URL.revokeObjectURL(cammVideoObjectUrl);
            }
            cammVideoObjectUrl = URL.createObjectURL(videoBlob);

            const liveVideo = document.getElementById('camera-preview');
            const playVideo = document.getElementById('camm-playback-video');
            liveVideo.classList.add('hidden');
            playVideo.classList.remove('hidden');
            playVideo.src = cammVideoObjectUrl;
            playVideo.load();

            const camBox = document.getElementById('camera-window');
            camBox.classList.remove('hidden');
            isCameraVisible = true;
            document.getElementById('cam-playback-badge').classList.remove('hidden');

            document.getElementById('camm-player-panel').classList.remove('hidden');
            document.getElementById('camm-loaded-title').textContent = filename;
            document.getElementById('camm-telemetry-badge').textContent = `${cammPlaybackPoints.length} pt`;
            document.getElementById('slider-camm-seek').value = 0;
            document.getElementById('camm-time-current').textContent = '00:00.0';

            if (isBottomCollapsed) {
                toggleBottomPanel();
            } else {
                updateSplitViewBottomOffset();
            }

            if (cammPlaybackPolyline) {
                cammPlaybackPolyline.setLatLngs(cammPlaybackPoints.map(p => [p.lat, p.lng]));
            }
            if (cammPlaybackHitPolyline) {
                cammPlaybackHitPolyline.setLatLngs(cammPlaybackPoints.map(p => [p.lat, p.lng]));
            }

            if (cammPlaybackPoints.length > 0) {
                trackingMode = 1;
                document.getElementById('btn-track-mode').textContent = TRACKING_LABELS[trackingMode];

                const first = cammPlaybackPoints[0];
                updateCammPlaybackMarker(first.lat, first.lng, first.heading || 0);
                syncCammMapToTime(0);

                const trackMeters = computeTotalTrackMeters(cammPlaybackPoints);
                const trackKmStr = (trackMeters / 1000).toFixed(2);
                document.getElementById('hud-distance').innerHTML = `${trackKmStr} <span class="text-[10px] font-normal">km</span>`;

                if (cammPlaybackPoints.length > 1 && trackMeters > 2 && map) {
                    const bounds = cammPlaybackPolyline.getBounds();
                    if (bounds.isValid()) {
                        const panel = document.getElementById('bottom-control-panel');
                        const bottomPad = (panel && !isBottomCollapsed) ? panel.offsetHeight + 24 : 40;
                        map.fitBounds(bounds, { paddingTopLeft: [30, 90], paddingBottomRight: [30, bottomPad], maxZoom: 18 });
                    }
                } else if (map) {
                    panWithBottomOffset([first.lat, first.lng], false);
                }

                if (trackMeters < 2) {
                    showToast(
                        `CAMM読込完了 (${cammPlaybackPoints.length} pt / 移動距離: ${trackMeters.toFixed(1)}m)`,
                        'このデータ内のGPS座標はほぼ同一地点（静止状態）で記録されています。移動しながら記録すると地図上のマーカーが軌跡に沿って動きます。',
                        'warning'
                    );
                } else {
                    showToast(
                        `CAMM動画読込完了: ${filename}`,
                        `GPS ${cammPlaybackPoints.length} pt（総距離 ${trackKmStr} km）を読み込みました。再生またはシークバーで位置が連動します。`
                    );
                }
            } else {
                if (cammPlaybackMarker && map) {
                    map.removeLayer(cammPlaybackMarker);
                    cammPlaybackMarker = null;
                }
                document.getElementById('camm-coord-readout').textContent = 'GPSメタデータなし';
                document.getElementById('camm-point-index-readout').textContent = 'pt 0 / 0';
                showToast(
                    `動画読込完了: ${filename}`,
                    'この動画にはCAMM GPSメタデータが含まれていませんが、再生バーで映像を操作できます。',
                    'warning'
                );
            }
        }

        function updateCammPlaybackMarker(lat, lng, headingDeg = 0) {
            if (!map) return;
            const iconHtml = `
                <div class="relative flex items-center justify-center w-12 h-12 cursor-grab active:cursor-grabbing" style="touch-action: none;">
                    <span class="absolute w-8 h-8 rounded-full bg-cyan-400/35 animate-ping pointer-events-none"></span>
                    <div class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-white shadow-lg flex items-center justify-center text-slate-950 text-xs font-black" style="transform: rotate(${headingDeg}deg);">
                        ▲
                    </div>
                </div>
            `;
            const icon = L.divIcon({
                html: iconHtml,
                className: '',
                iconSize: [48, 48],
                iconAnchor: [24, 24]
            });

            if (!cammPlaybackMarker) {
                cammPlaybackMarker = L.marker([lat, lng], {
                    icon: icon,
                    zIndexOffset: 500,
                    draggable: true
                }).addTo(map);

                // Pointer/Touch slide handler directly on marker element for reliable mobile & desktop scrubbing
                const attachMarkerPointerSlide = () => {
                    const el = cammPlaybackMarker && cammPlaybackMarker.getElement();
                    if (!el || el.dataset.slideBound === '1') return;
                    el.dataset.slideBound = '1';
                    el.style.touchAction = 'none';

                    let activePointerId = null;

                    const pointerToLatLng = (clientX, clientY) => {
                        const rect = map.getContainer().getBoundingClientRect();
                        const pt = L.point(clientX - rect.left, clientY - rect.top);
                        return map.containerPointToLatLng(pt);
                    };

                    el.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        activePointerId = e.pointerId;
                        if (el.setPointerCapture) {
                            try { el.setPointerCapture(e.pointerId); } catch (_) {}
                        }
                        isDraggingPlaybackMarker = true;
                        isScrubbingCamm = true;
                        if (map.dragging) map.dragging.disable();
                    });

                    el.addEventListener('pointermove', (e) => {
                        if (!isDraggingPlaybackMarker || e.pointerId !== activePointerId) return;
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        const ll = pointerToLatLng(e.clientX, e.clientY);
                        seekCammToNearestLatLng(ll, true);
                    });

                    const endSlide = (e) => {
                        if (activePointerId === null || (e.pointerId !== undefined && e.pointerId !== activePointerId)) return;
                        if (el.releasePointerCapture) {
                            try { el.releasePointerCapture(activePointerId); } catch (_) {}
                        }
                        activePointerId = null;
                        const ll = pointerToLatLng(e.clientX, e.clientY);
                        seekCammToNearestLatLng(ll, false);
                        isDraggingPlaybackMarker = false;
                        isScrubbingCamm = false;
                        if (map.dragging) map.dragging.enable();
                    };

                    el.addEventListener('pointerup', endSlide);
                    el.addEventListener('pointercancel', endSlide);
                };

                cammPlaybackMarker.on('add', attachMarkerPointerSlide);
                attachMarkerPointerSlide();

                cammPlaybackMarker.on('dragstart', () => {
                    isDraggingPlaybackMarker = true;
                    isScrubbingCamm = true;
                    if (map.dragging) map.dragging.disable();
                });

                cammPlaybackMarker.on('drag', (e) => {
                    const draggedLatLng = e.target.getLatLng();
                    seekCammToNearestLatLng(draggedLatLng, true);
                });

                cammPlaybackMarker.on('dragend', (e) => {
                    const draggedLatLng = e.target.getLatLng();
                    seekCammToNearestLatLng(draggedLatLng, false);
                    isDraggingPlaybackMarker = false;
                    isScrubbingCamm = false;
                    if (map.dragging) map.dragging.enable();
                });
            } else {
                if (!isDraggingPlaybackMarker) {
                    cammPlaybackMarker.setLatLng([lat, lng]);
                }
                cammPlaybackMarker.setIcon(icon);
            }
        }

        function getEffectiveCammVideoDuration() {
            const playVideo = document.getElementById('camm-playback-video');
            if (playVideo && Number.isFinite(playVideo.duration) && playVideo.duration > 0) {
                return playVideo.duration;
            }
            if (playVideo && playVideo.seekable && playVideo.seekable.length > 0) {
                const seekEnd = playVideo.seekable.end(playVideo.seekable.length - 1);
                if (Number.isFinite(seekEnd) && seekEnd > 0) return seekEnd;
            }
            if (cammKnownDurationSec > 0) return cammKnownDurationSec;
            const sliderMax = parseFloat(document.getElementById('slider-camm-seek')?.max);
            return Number.isFinite(sliderMax) && sliderMax > 0 ? sliderMax : 0;
        }

        function findNearestTrackRatioAndPoint(targetLatLng) {
            const pts = cammPlaybackPoints;
            if (!pts || pts.length === 0) return null;
            if (pts.length === 1) {
                return { ratio: 0, lat: pts[0].lat, lng: pts[0].lng, targetMs: pts[0].timestampOffsetMs || 0 };
            }

            const maxGpsMs = Math.max(1, pts[pts.length - 1].timestampOffsetMs || (pts.length - 1) * 1000);
            let bestDistSq = Infinity;
            let bestProjected = {
                lat: pts[0].lat,
                lng: pts[0].lng,
                targetMs: pts[0].timestampOffsetMs || 0
            };

            const tLat = targetLatLng.lat;
            const tLng = targetLatLng.lng;
            const cosLat = Math.cos(tLat * Math.PI / 180);

            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[i];
                const p1 = pts[i + 1];

                const ax = p0.lng * cosLat;
                const ay = p0.lat;
                const bx = p1.lng * cosLat;
                const by = p1.lat;
                const px = tLng * cosLat;
                const py = tLat;

                const abx = bx - ax;
                const aby = by - ay;
                const abLenSq = abx * abx + aby * aby;

                let segRatio = 0;
                if (abLenSq > 0) {
                    segRatio = ((px - ax) * abx + (py - ay) * aby) / abLenSq;
                    segRatio = Math.max(0, Math.min(1, segRatio));
                }

                const projX = ax + abx * segRatio;
                const projY = ay + aby * segRatio;
                const dx = px - projX;
                const dy = py - projY;
                const distSq = dx * dx + dy * dy;

                if (distSq < bestDistSq) {
                    bestDistSq = distSq;
                    const t0 = p0.timestampOffsetMs || 0;
                    const t1 = p1.timestampOffsetMs || t0;
                    bestProjected = {
                        lat: p0.lat + (p1.lat - p0.lat) * segRatio,
                        lng: p0.lng + (p1.lng - p0.lng) * segRatio,
                        targetMs: t0 + (t1 - t0) * segRatio
                    };
                }
            }

            const ratio = Math.max(0, Math.min(1, bestProjected.targetMs / maxGpsMs));
            return { ratio, ...bestProjected };
        }

        function seekCammToNearestLatLng(targetLatLng, keepDraggingMarker = false) {
            const snapped = findNearestTrackRatioAndPoint(targetLatLng);
            if (!snapped) return;

            const playVideo = document.getElementById('camm-playback-video');
            const seekSlider = document.getElementById('slider-camm-seek');
            const totalDur = getEffectiveCammVideoDuration();
            const targetSec = snapped.ratio * totalDur;

            if (playVideo && totalDur > 0) {
                playVideo.currentTime = Math.min(totalDur, Math.max(0, targetSec));
            }
            if (seekSlider) {
                if (totalDur > 0) seekSlider.max = totalDur;
                seekSlider.value = targetSec;
            }

            syncCammMapToTime(targetSec);

            if (cammPlaybackMarker && keepDraggingMarker) {
                cammPlaybackMarker.setLatLng([snapped.lat, snapped.lng]);
            }
        }

        function syncCammMapToTime(currentSeconds) {
            document.getElementById('camm-time-current').textContent = formatMMSSDecimal(currentSeconds);

            if (!cammPlaybackPoints || cammPlaybackPoints.length === 0) return;

            const totalPts = cammPlaybackPoints.length;
            const maxGpsMs = cammPlaybackPoints[totalPts - 1].timestampOffsetMs || 0;
            const effectiveVideoDurSec = getEffectiveCammVideoDuration();

            // Synchronize video timestamp with GPS telemetry timeline accurately
            let targetMs = currentSeconds * 1000;
            if (effectiveVideoDurSec > 0 && maxGpsMs > 0) {
                const progressRatio = Math.max(0, Math.min(1, currentSeconds / effectiveVideoDurSec));
                targetMs = progressRatio * maxGpsMs;
            }

            let interp = cammPlaybackPoints[0];
            let activeIndex = 0;

            if (totalPts === 1 || targetMs <= cammPlaybackPoints[0].timestampOffsetMs) {
                interp = cammPlaybackPoints[0];
                activeIndex = 0;
            } else if (targetMs >= maxGpsMs) {
                interp = cammPlaybackPoints[totalPts - 1];
                activeIndex = totalPts - 1;
            } else {
                for (let i = 0; i < totalPts - 1; i++) {
                    const p0 = cammPlaybackPoints[i];
                    const p1 = cammPlaybackPoints[i + 1];
                    if (targetMs >= p0.timestampOffsetMs && targetMs <= p1.timestampOffsetMs) {
                        const span = Math.max(1, p1.timestampOffsetMs - p0.timestampOffsetMs);
                        const ratio = (targetMs - p0.timestampOffsetMs) / span;
                        // Calculate bearing between p0 and p1 if heading is 0
                        let bearing = p0.heading || 0;
                        if (!bearing && (p0.lat !== p1.lat || p0.lng !== p1.lng)) {
                            bearing = computeBearingDeg(p0.lat, p0.lng, p1.lat, p1.lng);
                        }
                        interp = {
                            lat: p0.lat + (p1.lat - p0.lat) * ratio,
                            lng: p0.lng + (p1.lng - p0.lng) * ratio,
                            ele: (p0.ele || 0) + ((p1.ele || 0) - (p0.ele || 0)) * ratio,
                            speed: (p0.speed || 0) + ((p1.speed || 0) - (p0.speed || 0)) * ratio,
                            heading: bearing
                        };
                        activeIndex = i;
                        break;
                    }
                }
            }

            updateCammPlaybackMarker(interp.lat, interp.lng, interp.heading || 0);
            document.getElementById('camm-point-index-readout').textContent = `pt ${activeIndex + 1} / ${totalPts}`;
            document.getElementById('camm-coord-readout').textContent = `${interp.lat.toFixed(6)}, ${interp.lng.toFixed(6)}`;

            const speedKmh = ((interp.speed || 0) * 3.6).toFixed(1);
            document.getElementById('hud-elapsed').textContent = formatMMSS(Math.floor(currentSeconds));
            document.getElementById('hud-speed').innerHTML = `${speedKmh} <span class="text-[10px] font-normal">km/h</span>`;
            document.getElementById('cam-gps-badge').textContent = `CAMM: ${interp.lat.toFixed(5)}, ${interp.lng.toFixed(5)}`;

            if (trackingMode === 1 && map && !isDraggingPlaybackMarker) {
                panWithBottomOffset([interp.lat, interp.lng], false);
            }
        }

        // 3. Geolocation Watch & Recording Engine
        function startGeolocationWatch() {
            if (!('geolocation' in navigator)) {
                const badge = document.getElementById('cam-gps-badge');
                if (badge) badge.textContent = 'GPS非対応ブラウザ';
                return;
            }
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            watchId = navigator.geolocation.watchPosition(
                handlePositionUpdate,
                (err) => {
                    console.warn('Geolocation error:', err.message);
                    const badge = document.getElementById('cam-gps-badge');
                    if (badge && !isCammPlaybackActive) {
                        badge.textContent = `GPS待機 (${err.code})`;
                    }
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );

            if (gpsFallbackInterval) clearInterval(gpsFallbackInterval);
            gpsFallbackInterval = setInterval(() => {
                if (isRecording && Date.now() - lastGpsFixMs > 2000) {
                    navigator.geolocation.getCurrentPosition(
                        handlePositionUpdate,
                        () => {},
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                }
            }, 1500);
        }

        function restartGeolocationWatch() {
            startGeolocationWatch();
        }

        function handlePositionUpdate(pos) {
            lastGpsFixMs = Date.now();
            const { latitude: lat, longitude: lng, altitude, speed, heading } = pos.coords;
            const ele = Number.isFinite(altitude) ? altitude : 0;
            const spd = Number.isFinite(speed) && speed >= 0 ? speed : 0;
            const hdg = Number.isFinite(heading) && heading >= 0 ? heading : 0;

            currentPosition = { lat, lng, ele, speed: spd, heading: hdg, timestamp: pos.timestamp || Date.now() };
            updateUserMarker(lat, lng, isRecording);

            if (!isCammPlaybackActive) {
                const badge = document.getElementById('cam-gps-badge');
